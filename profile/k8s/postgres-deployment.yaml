apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-postgres
  template:
    metadata:
      labels:
        app: profile-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14
          env:
            - name: POSTGRES_DB
              value: profile_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: profile-db-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: profile-db-secret
                  key: SPRING_DATASOURCE_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: profile-pvc
